name: RateGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      DATABASE_URL: "sqlite:///./ci_test.db"
      MOCK_EMAIL_CONNECTOR: "true"
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: "ci-placeholder-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-key"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Execute Full Pytest Test Suite
        run: |
          pytest -v

      - name: Run Quality Gate Calibration Harness (Phase 2.0.3)
        run: |
          python scripts/calibrate.py

      - name: Run Pilot 1 End-to-End Gate Verification
        run: |
          python scripts/run_pilot_end_to_end.py

      - name: Run 2,500 Invoice Scale Benchmark
        run: |
          python scripts/benchmark_2500_invoices.py
