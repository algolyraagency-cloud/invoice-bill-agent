[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rateguard-ai"
version = "0.1.0"
description = "RateGuard AI - Freight Audit & Recovery Platform"
readme = "implementation.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.23.0",
    "supabase>=2.4.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "api/index.py:app"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "apps/api/tests",
    "apps/worker/tests",
    "packages/audit-engine/tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "apps",
    "packages"
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "repos",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.setuptools]
packages = ["api", "apps", "infra", "packages"]
